plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}


android {

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file("../" + keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    namespace 'com.nurvpn.app'
    compileSdk 34

    defaultConfig {
        ndk {
            // ★ Variant B: faqat arm64-v8a (zamonaviy telefonlar)
            abiFilters 'arm64-v8a'
        }
        applicationId "com.nurvpn.app"
        minSdk 24
        targetSdk 34
        versionCode 23
        versionName "1.12.1"   // ★ FIX112-BUG2: deep link tuzatishlari
        ndk {
            debugSymbolLevel = "NONE"
        }

    }
        // ★ Variant B: splits olib tashlandi, abiFilters 'arm64-v8a'



    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug   { debuggable true }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*'
            ]
        }
        jniLibs {
            // ★★★ KRITIK: extractNativeLibs=true qiladi.
            // Busiz AGP (minSdk 24+) libbox.so ni APK ichida SIQMASDAN
            // (Stored, 0%) saqlaydi -> 60.1 MB, ya'ni APK'ning 94.5%.
            // Yoqilganda deflate ishlaydi -> ~19.0 MB (31.7% nisbat).
            // libbox.so da debug symbol yo'q, lekin Go PC-table/string
            // jadvallari juda yaxshi siqiladi.
            useLegacyPackaging = true
        }
    }

    // AndroidX/Material kutubxonalaridan keladigan 80+ til resurslarini olib tashlash.
    // locales_config.xml allaqachon faqat shu 3 tilni e'lon qilgan.
    defaultConfig {
        resourceConfigurations += ['uz', 'ru', 'en']
    }

    androidResources {
        noCompress 'bin'
    }

    // Robolectric uchun (Android framework'ga bog'liq kodni JVM'da test qilish)
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation("androidx.biometric:biometric:1.1.0")
    implementation files('libs/libbox.aar')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // ═══ Unit testlar (app/src/test/) ═══
    // DefaultConfig'da `returnDefaultValues` YOQILMAYDI — Android API'lari
    // chaqirilsa test "not mocked" xatosi bilan yiqiladi. Bu ATAYLAB shunday:
    // testlar Android'ga bog'liq bo'lmagan sof mantiqni tekshiradi.
    // Android framework kerak bo'lgan kod uchun Robolectric ishlatiladi.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'org.json:json:20231013'
}
